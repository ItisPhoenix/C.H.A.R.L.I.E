[project]
name = "charlie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyzmq>=25.0",
    "fastapi>=0.110.4",
    "uvicorn>=0.29",
    "hypercorn>=0.14.4",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "kokoro-onnx>=0.4",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
desktop = [
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pyautogui>=0.9",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
    "mss>=9.0",
    "Pillow>=10.0",
    "dxcam>=0.3.0; sys_platform == 'win32'",
]
browser = [
    "playwright>=1.48",
    "scrapling[fetchers]>=0.3",
]
research = [
    "crawl4ai>=0.4",
]
hud = [
    "PySide6>=6.7; sys_platform == 'win32'",
]
telegram = [
    "python-telegram-bot>=21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
