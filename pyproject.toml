[project]
name = "charlie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Browser TLS/JA3 + HTTP2 fingerprint for web fetching. fetch.py falls back
    # to httpx when absent, so removing it degrades rather than breaks.
    "curl-cffi>=0.13",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyzmq>=25.0",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "av>=12",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "psutil>=5.9",
    # Pinned exactly: the accepted evaluation ran against 0.31.0, and Cua is a
    # control-plane component whose behaviour must not drift under Charlie.
    "cua-driver==0.31.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
# PyWinRT dependencies are split by namespace; list only the types used by the adapter.
media = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1,<4; sys_platform == 'win32'",
    "winrt-Windows.System>=3.2.1,<4; sys_platform == 'win32'",
]
desktop = [
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pyautogui>=0.9",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
    "mss>=9.0",
    "Pillow>=10.0",
    "dxcam>=0.3.0; sys_platform == 'win32'",
]
browser = [
    "playwright>=1.48",
    "scrapling[fetchers]>=0.3",
]
# There is deliberately NO `research` extra. Scrapling in the browser extra
# handles bounded dynamic-page escalation behind the research egress proxy.
# Crawl4AI remains optional because its browser stack previously failed during
# Charlie's Windows event-loop startup.
# `rate-limiter` is the official PTB extra backing telegram.ext.AIORateLimiter. PTB owns the
# aiolimiter pin (currently <1.3,>=1.1); expressing it as the extra keeps that bound coupled to
# the installed PTB instead of duplicating it here where it would drift. Without it,
# charlie/telegram_bot.py:build_rate_limiter() degrades to None and client-side 429 smoothing
# never runs.
telegram = [
    "python-telegram-bot[rate-limiter]>=21.0",
]
agent-reach = [
    # The upstream project is GitHub-only; PyPI's same-name package is unrelated.
    "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/refs/tags/v1.5.0.zip",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts: a bare "-q" here combines with an operator's own "pytest -q" to
# reach verbose == -2, which suppresses the pass/fail count line entirely and
# makes a green run indistinguishable from a silent collection failure.
pythonpath = ["."]

[tool.coverage.run]
source = ["charlie"]
branch = false

[tool.coverage.report]
fail_under = 70
precision = 0
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
