[project]
name = "charlie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Browser TLS/JA3 + HTTP2 fingerprint for web fetching. fetch.py falls back
    # to httpx when absent, so removing it degrades rather than breaks.
    "curl-cffi>=0.13",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyzmq>=25.0",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "av>=12",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
# NOTE: `winrt` is intentionally NOT here. It is unmaintained upstream, ships wheels for
# cp37/cp38/cp39 only, has no sdist, and cannot satisfy requires-python >=3.12 -- including
# it makes `uv lock` unsatisfiable at every version pin. It was only used for the WinRT
# GlobalSystemMediaTransportControls (GSMTC) session manager and DataReader thumbnail
# decoding. Volume/mute still work via pycaw; transport control, now-playing metadata, and
# artwork degrade to "unavailable" (charlie/media_adapter.py guards both imports in
# try/except). Do not re-add without a replacement GSMTC path that is not PyPI-blocked.
media = [
    "pycaw>=20240210; sys_platform == 'win32'",
]
desktop = [
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pyautogui>=0.9",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
    "mss>=9.0",
    "Pillow>=10.0",
    "dxcam>=0.3.0; sys_platform == 'win32'",
]
browser = [
    "playwright>=1.48",
    "scrapling[fetchers]>=0.3",
]
# There is deliberately NO `research` extra. It previously held exactly one
# dependency, `crawl4ai>=0.4`, and it was removed 2026-09-30. Do not re-add it
# without first fixing the failure below and re-measuring.
#
# WHY crawl4ai is absent (measured, not assumed):
#   * The research extra was activated, which installed crawl4ai 0.9.2 and made
#     charlie/research/crawler.py:crawl_document() stop short-circuiting on
#     `except ImportError: return None`. Every source that plain-HTTP extraction
#     could not read then paid a real browser-launch attempt and got nothing.
#     Live log: 14:36:57.302 fetch failed -> 14:37:02.483 "Crawl4AI failed"
#     -> 14:37:02.494 escalation. That is 5.181s burned per source, multiplied
#     by every unreadable source in the run, for a guaranteed null.
#   * The failure is in the async driver, NOT in Playwright. Verified directly:
#     `playwright.sync_api.sync_playwright().start()` succeeds, and the
#     ms-playwright cache has chromium-1169/1217/1223/1228 installed. crawl4ai
#     dies inside its own `browser_manager.start()` at
#     `self.playwright = await async_playwright().start()`. Standalone it can
#     also succeed, which is why this regressed silently: it is the research
#     path that reliably fails, and it fails late.
#   * Even when it does succeed it is not worth it here. Measured on
#     https://example.com/some-page, a page plain HTTP already handles:
#     11841ms cold, 1531ms warm, and plain-HTTP fetch is the cheaper path that
#     runs first. On JS-heavy real sources the same launch cost applies before
#     any page load is even attempted.
#   * The correct escalation for unreadable pages is the existing Browser
#     Executor path (charlie/research/engine.py:158, charlie/browser/actions.py),
#     which is already exercised and already logged as "Escalating to Browser
#     Executor". Removing crawl4ai restores crawl_document() to a sub-millisecond
#   no-op and hands off immediately.
#
# If crawl4ai is ever revisited, the bar is: (a) reproduce the
# `async_playwright().start()` failure inside the engine's own event loop, not
# in a standalone script; (b) prove the fetched document is better than what the
# Browser Executor returns for the same URL; (c) publish before/after ms. Until
# then it is strictly cost.
# `rate-limiter` is the official PTB extra backing telegram.ext.AIORateLimiter. PTB owns the
# aiolimiter pin (currently <1.3,>=1.1); expressing it as the extra keeps that bound coupled to
# the installed PTB instead of duplicating it here where it would drift. Without it,
# charlie/telegram_bot.py:build_rate_limiter() degrades to None and client-side 429 smoothing
# never runs.
telegram = [
    "python-telegram-bot[rate-limiter]>=21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["charlie"]
branch = false

[tool.coverage.report]
fail_under = 70
precision = 0
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
