[project]
name = "charlie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyzmq>=25.0",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "av>=12",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
# NOTE: `winrt` is intentionally NOT here. It is unmaintained upstream, ships wheels for
# cp37/cp38/cp39 only, has no sdist, and cannot satisfy requires-python >=3.12 -- including
# it makes `uv lock` unsatisfiable at every version pin. It was only used for the WinRT
# GlobalSystemMediaTransportControls (GSMTC) session manager and DataReader thumbnail
# decoding. Volume/mute still work via pycaw; transport control, now-playing metadata, and
# artwork degrade to "unavailable" (charlie/media_adapter.py guards both imports in
# try/except). Do not re-add without a replacement GSMTC path that is not PyPI-blocked.
media = [
    "pycaw>=20240210; sys_platform == 'win32'",
]
desktop = [
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pyautogui>=0.9",
    "pynput>=1.7",
    "pytesseract>=0.3.10",
    "mss>=9.0",
    "Pillow>=10.0",
    "dxcam>=0.3.0; sys_platform == 'win32'",
]
browser = [
    "playwright>=1.48",
    "scrapling[fetchers]>=0.3",
]
research = [
    "crawl4ai>=0.4",
]
telegram = [
    "python-telegram-bot>=21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["charlie"]
branch = false

[tool.coverage.report]
fail_under = 70
precision = 0
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
