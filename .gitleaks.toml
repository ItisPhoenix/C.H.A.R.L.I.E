# Gitleaks configuration for C.H.A.R.L.I.E.
[extend]
useDefault = true

[allowlist]
description = "Global allowlist for tests, examples, and mock data"
paths = [
    '''(?i)^\.env\.example$''',
    '''(?i)^frontend/\.oxlintrc\.json$''',
    '''(?i)^data/tiles/.*\.pmtiles$''',
    '''(?i)^tests/.*$''',
]
regexes = [
    '''(?i)sk-(?:secret-key|charlie-mock|1234567890)''',
    '''(?i)your_[a-z0-9_]+_here''',
    '''(?i)charlie_searxng_secret''',
    '''(?i)super-secret-key''',
]
