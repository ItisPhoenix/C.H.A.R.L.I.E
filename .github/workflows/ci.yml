name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # No `--extra research`: that extra held only crawl4ai, which was removed
        # because it cannot start Playwright on the research path and costs
        # seconds per source for a null result. See the comment block above
        # `browser = [...]` in pyproject.toml. Do not re-add it casually.
        run: uv sync --locked --extra dev --extra desktop --extra telegram --extra browser

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Ruff check
        run: uv run ruff check .

      - name: Run tests
        run: >-
          uv run pytest -v
          --continue-on-collection-errors
          --cov=charlie
          --cov-report=term-missing
